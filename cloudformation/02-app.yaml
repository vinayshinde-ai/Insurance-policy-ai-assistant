AWSTemplateFormatVersion: "2010-09-09"
Description: >-
  Insurance Policy AI Assistant - application stack (VPC, ALB, Auto Scaling Streamlit app, CloudFront,
  WAF, monitoring). Must be deployed in us-east-1 because the WAF WebACL has CLOUDFRONT scope.
  Author: Vinay Shinde, Generative AI Engineer (vinayshinde.tech@outlook.com).

Metadata:
  Author: Vinay Shinde
  Contact: vinayshinde.tech@outlook.com

Parameters:
  Environment:
    Type: String
    Default: prod
    AllowedPattern: "^[a-z][a-z0-9]{1,9}$"
  PlatformStackName:
    Type: String
    Description: Name of the deployed 01-platform stack.
  AppArtifactKey:
    Type: String
    Description: S3 key of the app zip in the artifacts bucket (set by scripts/deploy.sh).
  ModelId:
    Type: String
    Default: global.anthropic.claude-haiku-4-5-20251001-v1:0
    Description: Bedrock model ID or inference profile ID used for answers.
  MaxTokens:
    Type: Number
    Default: 1024
    MinValue: 256
    MaxValue: 8192
  InstanceType:
    Type: String
    Default: t3.small
    AllowedValues: [t3.small, t3.medium, t3.large, m6i.large]
  LatestAmiId:
    Type: AWS::SSM::Parameter::Value<AWS::EC2::Image::Id>
    Default: /aws/service/ami-amazon-linux-latest/al2023-ami-kernel-default-x86_64
  MinInstances:
    Type: Number
    Default: 2
    MinValue: 1
  MaxInstances:
    Type: Number
    Default: 4
    MinValue: 2
  CloudFrontPrefixListId:
    Type: String
    Default: pl-3b927c52
    Description: AWS-managed CloudFront origin-facing prefix list (pl-3b927c52 is us-east-1).
  OriginVerifySecret:
    Type: String
    NoEcho: true
    MinLength: 32
    Description: Shared secret header sent by CloudFront to the ALB. Generated by scripts/deploy.sh.
  WafRateLimit:
    Type: Number
    Default: 500
    MinValue: 100
    Description: Max requests per IP per 5 minutes before WAF blocks.
  AlarmEmail:
    Type: String
    Default: vinayshinde.tech@outlook.com
  ChatTtlDays:
    Type: Number
    Default: 90
  LogRetentionDays:
    Type: Number
    Default: 90
    AllowedValues: [30, 60, 90, 180, 365]

Resources:
  # ------------------------------------------------------------------ Network
  Vpc:
    Type: AWS::EC2::VPC
    Properties:
      CidrBlock: 10.20.0.0/16
      EnableDnsHostnames: true
      EnableDnsSupport: true
      Tags:
        - {Key: Name, Value: !Sub "${AWS::StackName}-vpc"}
        - {Key: Project, Value: insurance-policy-ai-assistant}
        - {Key: Owner, Value: Vinay Shinde}
        - {Key: Environment, Value: !Ref Environment}

  InternetGateway:
    Type: AWS::EC2::InternetGateway
    Properties:
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-igw"}]

  VpcGatewayAttachment:
    Type: AWS::EC2::VPCGatewayAttachment
    Properties:
      VpcId: !Ref Vpc
      InternetGatewayId: !Ref InternetGateway

  PublicSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.0.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public-a"}]
  PublicSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.1.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public-b"}]
  PrivateSubnetA:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.10.0/24
      AvailabilityZone: !Select [0, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-private-a"}]
  PrivateSubnetB:
    Type: AWS::EC2::Subnet
    Properties:
      VpcId: !Ref Vpc
      CidrBlock: 10.20.11.0/24
      AvailabilityZone: !Select [1, !GetAZs ""]
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-private-b"}]

  PublicRouteTable:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-public"}]
  PublicDefaultRoute:
    Type: AWS::EC2::Route
    DependsOn: VpcGatewayAttachment
    Properties:
      RouteTableId: !Ref PublicRouteTable
      DestinationCidrBlock: 0.0.0.0/0
      GatewayId: !Ref InternetGateway
  PublicSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetA, RouteTableId: !Ref PublicRouteTable}
  PublicSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PublicSubnetB, RouteTableId: !Ref PublicRouteTable}

  # Single NAT gateway shared by both private subnets (cost-optimised). If its AZ fails,
  # instances in both AZs lose outbound access to Bedrock and Cognito.
  NatEipA:
    Type: AWS::EC2::EIP
    DependsOn: VpcGatewayAttachment
    Properties: {Domain: vpc}
  NatGatewayA:
    Type: AWS::EC2::NatGateway
    Properties:
      AllocationId: !GetAtt NatEipA.AllocationId
      SubnetId: !Ref PublicSubnetA
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-nat-a"}]

  PrivateRouteTableA:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-private-a"}]
  PrivateRouteTableB:
    Type: AWS::EC2::RouteTable
    Properties:
      VpcId: !Ref Vpc
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-private-b"}]
  PrivateDefaultRouteA:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableA
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  PrivateDefaultRouteB:
    Type: AWS::EC2::Route
    Properties:
      RouteTableId: !Ref PrivateRouteTableB
      DestinationCidrBlock: 0.0.0.0/0
      NatGatewayId: !Ref NatGatewayA
  PrivateSubnetARouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetA, RouteTableId: !Ref PrivateRouteTableA}
  PrivateSubnetBRouteTable:
    Type: AWS::EC2::SubnetRouteTableAssociation
    Properties: {SubnetId: !Ref PrivateSubnetB, RouteTableId: !Ref PrivateRouteTableB}

  # Free gateway endpoints keep S3 and DynamoDB traffic off the NAT gateways.
  S3GatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.s3"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTableA, !Ref PrivateRouteTableB]
  DynamoDbGatewayEndpoint:
    Type: AWS::EC2::VPCEndpoint
    Properties:
      VpcId: !Ref Vpc
      ServiceName: !Sub "com.amazonaws.${AWS::Region}.dynamodb"
      VpcEndpointType: Gateway
      RouteTableIds: [!Ref PrivateRouteTableA, !Ref PrivateRouteTableB]

  FlowLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/insurance-assistant/${Environment}/vpc-flow-logs"
      RetentionInDays: !Ref LogRetentionDays
  FlowLogRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: vpc-flow-logs.amazonaws.com}
            Action: sts:AssumeRole
            Condition: {StringEquals: {"aws:SourceAccount": !Ref AWS::AccountId}}
      Policies:
        - PolicyName: flow-logs
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Effect: Allow
                Action: [logs:CreateLogStream, logs:PutLogEvents, logs:DescribeLogStreams]
                Resource: !GetAtt FlowLogGroup.Arn
  VpcFlowLog:
    Type: AWS::EC2::FlowLog
    Properties:
      ResourceId: !Ref Vpc
      ResourceType: VPC
      TrafficType: REJECT
      LogDestinationType: cloud-watch-logs
      LogGroupName: !Ref FlowLogGroup
      DeliverLogsPermissionArn: !GetAtt FlowLogRole.Arn

  # ------------------------------------------------------------------ Security groups
  AlbSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: ALB - HTTP from CloudFront origin-facing IPs only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 80
          ToPort: 80
          SourcePrefixListId: !Ref CloudFrontPrefixListId
          Description: CloudFront origin-facing
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-alb"}]

  AppSecurityGroup:
    Type: AWS::EC2::SecurityGroup
    Properties:
      GroupDescription: Streamlit instances - port 8501 from the ALB only
      VpcId: !Ref Vpc
      SecurityGroupIngress:
        - IpProtocol: tcp
          FromPort: 8501
          ToPort: 8501
          SourceSecurityGroupId: !Ref AlbSecurityGroup
          Description: From ALB
      SecurityGroupEgress:
        - IpProtocol: tcp
          FromPort: 443
          ToPort: 443
          CidrIp: 0.0.0.0/0
          Description: HTTPS to AWS APIs, Cognito JWKS and package repositories
      Tags: [{Key: Name, Value: !Sub "${AWS::StackName}-app"}]

  AlbToAppEgress:
    Type: AWS::EC2::SecurityGroupEgress
    Properties:
      GroupId: !Ref AlbSecurityGroup
      IpProtocol: tcp
      FromPort: 8501
      ToPort: 8501
      DestinationSecurityGroupId: !Ref AppSecurityGroup
      Description: To Streamlit instances

  # ------------------------------------------------------------------ IAM for instances
  AppInstanceRole:
    Type: AWS::IAM::Role
    Properties:
      AssumeRolePolicyDocument:
        Version: "2012-10-17"
        Statement:
          - Effect: Allow
            Principal: {Service: ec2.amazonaws.com}
            Action: sts:AssumeRole
      ManagedPolicyArns:
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/AmazonSSMManagedInstanceCore"
        - !Sub "arn:${AWS::Partition}:iam::aws:policy/CloudWatchAgentServerPolicy"
      Policies:
        - PolicyName: app-access
          PolicyDocument:
            Version: "2012-10-17"
            Statement:
              - Sid: ReadCustomerPolicies
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Bucket}/*"
                  - Bucket: {"Fn::ImportValue": !Sub "${PlatformStackName}-CustomerPolicyBucket"}
              - Sid: ListCustomerPoliciesSoMissingKeysReturn404
                Effect: Allow
                Action: s3:ListBucket
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Bucket}"
                  - Bucket: {"Fn::ImportValue": !Sub "${PlatformStackName}-CustomerPolicyBucket"}
              - Sid: ReadAppArtifact
                Effect: Allow
                Action: s3:GetObject
                Resource: !Sub
                  - "arn:${AWS::Partition}:s3:::${Bucket}/app/*"
                  - Bucket: {"Fn::ImportValue": !Sub "${PlatformStackName}-ArtifactsBucket"}
              - Sid: WriteChatHistory
                Effect: Allow
                Action: dynamodb:PutItem
                Resource: {"Fn::ImportValue": !Sub "${PlatformStackName}-ChatHistoryTableArn"}
              - Sid: RetrieveFromKnowledgeBase
                Effect: Allow
                Action: bedrock:Retrieve
                Resource: {"Fn::ImportValue": !Sub "${PlatformStackName}-KnowledgeBaseArn"}
              - Sid: ApplyGuardrail
                Effect: Allow
                Action: bedrock:ApplyGuardrail
                Resource: {"Fn::ImportValue": !Sub "${PlatformStackName}-GuardrailArn"}
              - Sid: InvokeInferenceProfile
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                Resource: !Sub "arn:${AWS::Partition}:bedrock:${AWS::Region}:${AWS::AccountId}:inference-profile/${ModelId}"
              - Sid: InvokeUnderlyingFoundationModel
                Effect: Allow
                Action: [bedrock:InvokeModel, bedrock:InvokeModelWithResponseStream]
                # Cross-region and global inference profiles route to the model in other regions,
                # and global profiles use a region-less ARN, so the region must be a wildcard.
                Resource:
                  - !Sub "arn:${AWS::Partition}:bedrock:*::foundation-model/*"
                  - !Sub "arn:${AWS::Partition}:bedrock:::foundation-model/*"

  AppInstanceProfile:
    Type: AWS::IAM::InstanceProfile
    Properties:
      Roles: [!Ref AppInstanceRole]

  # ------------------------------------------------------------------ Logs
  AppLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      LogGroupName: !Sub "/insurance-assistant/${Environment}/app"
      RetentionInDays: !Ref LogRetentionDays

  AppErrorMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '"ERROR"'
      MetricTransformations:
        - MetricNamespace: !Sub "InsuranceAssistant/${Environment}"
          MetricName: AppErrors
          MetricValue: "1"
          DefaultValue: 0

  GuardrailMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '"guardrail=True"'
      MetricTransformations:
        - MetricNamespace: !Sub "InsuranceAssistant/${Environment}"
          MetricName: GuardrailInterventions
          MetricValue: "1"
          DefaultValue: 0

  ChatTurnMetricFilter:
    Type: AWS::Logs::MetricFilter
    Properties:
      LogGroupName: !Ref AppLogGroup
      FilterPattern: '"turn session="'
      MetricTransformations:
        - MetricNamespace: !Sub "InsuranceAssistant/${Environment}"
          MetricName: ChatTurns
          MetricValue: "1"
          DefaultValue: 0

  # ------------------------------------------------------------------ Compute
  AppLaunchTemplate:
    Type: AWS::EC2::LaunchTemplate
    Properties:
      LaunchTemplateData:
        ImageId: !Ref LatestAmiId
        InstanceType: !Ref InstanceType
        IamInstanceProfile: {Arn: !GetAtt AppInstanceProfile.Arn}
        SecurityGroupIds: [!Ref AppSecurityGroup]
        Monitoring: {Enabled: true}
        MetadataOptions:
          HttpTokens: required
          HttpPutResponseHopLimit: 1
          HttpEndpoint: enabled
        BlockDeviceMappings:
          - DeviceName: /dev/xvda
            Ebs:
              VolumeSize: 20
              VolumeType: gp3
              DeleteOnTermination: true
        TagSpecifications:
          - ResourceType: instance
            Tags:
              - {Key: Name, Value: !Sub "${AWS::StackName}-app"}
              - {Key: Project, Value: insurance-policy-ai-assistant}
              - {Key: Owner, Value: Vinay Shinde}
              - {Key: Environment, Value: !Ref Environment}
        UserData:
          Fn::Base64: !Sub
            - |
              #!/bin/bash
              set -euxo pipefail
              signal() { /opt/aws/bin/cfn-signal -e "$1" --stack "${AWS::StackName}" --resource AppAutoScalingGroup --region "${AWS::Region}" || true; }
              trap 'signal 1' ERR

              dnf install -y python3.11 python3.11-pip unzip amazon-cloudwatch-agent aws-cfn-bootstrap

              id assistant || useradd --system --home-dir /opt/insurance-assistant --shell /sbin/nologin assistant
              mkdir -p /opt/insurance-assistant/app /var/log/insurance-assistant
              aws s3 cp "s3://${ArtifactsBucket}/${AppArtifactKey}" /tmp/app.zip --region "${AWS::Region}"
              unzip -o /tmp/app.zip -d /opt/insurance-assistant/app
              python3.11 -m venv /opt/insurance-assistant/venv
              /opt/insurance-assistant/venv/bin/pip install --no-cache-dir --upgrade pip
              /opt/insurance-assistant/venv/bin/pip install --no-cache-dir -r /opt/insurance-assistant/app/requirements.txt
              chown -R assistant:assistant /opt/insurance-assistant /var/log/insurance-assistant

              cat > /etc/insurance-assistant.env <<'EOF'
              AWS_REGION=${AWS::Region}
              AWS_DEFAULT_REGION=${AWS::Region}
              KB_ID=${KbId}
              GUARDRAIL_ID=${GuardrailId}
              GUARDRAIL_VERSION=${GuardrailVersion}
              MODEL_ID=${ModelId}
              MAX_TOKENS=${MaxTokens}
              POLICY_BUCKET=${PolicyBucket}
              CHAT_TABLE=${ChatTable}
              USER_POOL_ID=${UserPoolId}
              APP_CLIENT_ID=${UserPoolClientId}
              CHAT_TTL_DAYS=${ChatTtlDays}
              EOF
              chmod 640 /etc/insurance-assistant.env
              chgrp assistant /etc/insurance-assistant.env

              cat > /etc/systemd/system/insurance-assistant.service <<'EOF'
              [Unit]
              Description=Insurance Policy AI Assistant (Streamlit)
              After=network-online.target
              Wants=network-online.target

              [Service]
              User=assistant
              Group=assistant
              EnvironmentFile=/etc/insurance-assistant.env
              WorkingDirectory=/opt/insurance-assistant/app
              ExecStart=/opt/insurance-assistant/venv/bin/streamlit run app.py --server.port 8501 --server.address 0.0.0.0 --server.headless true --browser.gatherUsageStats false --client.toolbarMode minimal
              Restart=always
              RestartSec=5
              StandardOutput=append:/var/log/insurance-assistant/app.log
              StandardError=append:/var/log/insurance-assistant/app.log
              NoNewPrivileges=true
              ProtectSystem=full
              PrivateTmp=true

              [Install]
              WantedBy=multi-user.target
              EOF

              cat > /etc/logrotate.d/insurance-assistant <<'EOF'
              /var/log/insurance-assistant/*.log {
                daily
                rotate 7
                compress
                missingok
                copytruncate
              }
              EOF

              cat > /opt/aws/amazon-cloudwatch-agent/etc/config.json <<'EOF'
              {
                "agent": {"metrics_collection_interval": 60},
                "metrics": {
                  "namespace": "InsuranceAssistant/${Environment}",
                  "append_dimensions": {"AutoScalingGroupName": "${!aws:AutoScalingGroupName}"},
                  "aggregation_dimensions": [["AutoScalingGroupName"]],
                  "metrics_collected": {
                    "mem": {"measurement": ["mem_used_percent"]},
                    "disk": {"measurement": ["used_percent"], "resources": ["/"]}
                  }
                },
                "logs": {
                  "logs_collected": {
                    "files": {
                      "collect_list": [
                        {"file_path": "/var/log/insurance-assistant/app.log", "log_group_name": "${AppLogGroup}", "log_stream_name": "{instance_id}"}
                      ]
                    }
                  }
                }
              }
              EOF
              /opt/aws/amazon-cloudwatch-agent/bin/amazon-cloudwatch-agent-ctl -a fetch-config -m ec2 -s -c file:/opt/aws/amazon-cloudwatch-agent/etc/config.json

              systemctl daemon-reload
              systemctl enable --now insurance-assistant

              for i in $(seq 1 60); do
                if curl -sf http://127.0.0.1:8501/_stcore/health; then signal 0; exit 0; fi
                sleep 5
              done
              signal 1
            - ArtifactsBucket: {"Fn::ImportValue": !Sub "${PlatformStackName}-ArtifactsBucket"}
              KbId: {"Fn::ImportValue": !Sub "${PlatformStackName}-KnowledgeBaseId"}
              GuardrailId: {"Fn::ImportValue": !Sub "${PlatformStackName}-GuardrailId"}
              GuardrailVersion: {"Fn::ImportValue": !Sub "${PlatformStackName}-GuardrailVersion"}
              PolicyBucket: {"Fn::ImportValue": !Sub "${PlatformStackName}-CustomerPolicyBucket"}
              ChatTable: {"Fn::ImportValue": !Sub "${PlatformStackName}-ChatHistoryTable"}
              UserPoolId: {"Fn::ImportValue": !Sub "${PlatformStackName}-UserPoolId"}
              UserPoolClientId: {"Fn::ImportValue": !Sub "${PlatformStackName}-UserPoolClientId"}

  AppAutoScalingGroup:
    Type: AWS::AutoScaling::AutoScalingGroup
    DependsOn: [PrivateDefaultRouteA, PrivateDefaultRouteB, S3GatewayEndpoint]
    CreationPolicy:
      ResourceSignal:
        Count: !Ref MinInstances
        Timeout: PT20M
    UpdatePolicy:
      AutoScalingRollingUpdate:
        MinInstancesInService: !Ref MinInstances
        MaxBatchSize: 1
        PauseTime: PT20M
        WaitOnResourceSignals: true
        SuspendProcesses: [HealthCheck, ReplaceUnhealthy, AZRebalance, AlarmNotification, ScheduledActions]
    Properties:
      VPCZoneIdentifier: [!Ref PrivateSubnetA, !Ref PrivateSubnetB]
      LaunchTemplate:
        LaunchTemplateId: !Ref AppLaunchTemplate
        Version: !GetAtt AppLaunchTemplate.LatestVersionNumber
      MinSize: !Ref MinInstances
      MaxSize: !Ref MaxInstances
      DesiredCapacity: !Ref MinInstances
      HealthCheckType: ELB
      HealthCheckGracePeriod: 600
      TargetGroupARNs: [!Ref AppTargetGroup]
      MetricsCollection: [{Granularity: 1Minute}]
      Tags:
        - {Key: Project, Value: insurance-policy-ai-assistant, PropagateAtLaunch: false}
        - {Key: Owner, Value: Vinay Shinde, PropagateAtLaunch: false}

  CpuScalingPolicy:
    Type: AWS::AutoScaling::ScalingPolicy
    Properties:
      AutoScalingGroupName: !Ref AppAutoScalingGroup
      PolicyType: TargetTrackingScaling
      TargetTrackingConfiguration:
        PredefinedMetricSpecification: {PredefinedMetricType: ASGAverageCPUUtilization}
        TargetValue: 60

  # ------------------------------------------------------------------ Load balancer
  LoadBalancer:
    Type: AWS::ElasticLoadBalancingV2::LoadBalancer
    Properties:
      Type: application
      Scheme: internet-facing
      Subnets: [!Ref PublicSubnetA, !Ref PublicSubnetB]
      SecurityGroups: [!Ref AlbSecurityGroup]
      LoadBalancerAttributes:
        - {Key: idle_timeout.timeout_seconds, Value: "300"}
        - {Key: routing.http.drop_invalid_header_fields.enabled, Value: "true"}
        - {Key: deletion_protection.enabled, Value: "true"}
        - {Key: access_logs.s3.enabled, Value: "true"}
        - Key: access_logs.s3.bucket
          Value: {"Fn::ImportValue": !Sub "${PlatformStackName}-AccessLogsBucket"}
        - {Key: access_logs.s3.prefix, Value: alb}
      Tags:
        - {Key: Project, Value: insurance-policy-ai-assistant}
        - {Key: Owner, Value: Vinay Shinde}
        - {Key: Environment, Value: !Ref Environment}

  AppTargetGroup:
    Type: AWS::ElasticLoadBalancingV2::TargetGroup
    Properties:
      VpcId: !Ref Vpc
      Protocol: HTTP
      Port: 8501
      TargetType: instance
      HealthCheckPath: /_stcore/health
      HealthCheckIntervalSeconds: 15
      HealthyThresholdCount: 2
      UnhealthyThresholdCount: 3
      Matcher: {HttpCode: "200"}
      TargetGroupAttributes:
        # Streamlit keeps session state in process memory, so a browser must stay on one instance.
        - {Key: stickiness.enabled, Value: "true"}
        - {Key: stickiness.type, Value: lb_cookie}
        - {Key: stickiness.lb_cookie.duration_seconds, Value: "86400"}
        - {Key: deregistration_delay.timeout_seconds, Value: "30"}

  HttpListener:
    Type: AWS::ElasticLoadBalancingV2::Listener
    Properties:
      LoadBalancerArn: !Ref LoadBalancer
      Protocol: HTTP
      Port: 80
      DefaultActions:
        - Type: fixed-response
          FixedResponseConfig: {StatusCode: "403", ContentType: text/plain, MessageBody: Forbidden}

  # Only requests that came through this CloudFront distribution carry the secret header.
  ForwardFromCloudFrontRule:
    Type: AWS::ElasticLoadBalancingV2::ListenerRule
    Properties:
      ListenerArn: !Ref HttpListener
      Priority: 1
      Conditions:
        - Field: http-header
          HttpHeaderConfig:
            HttpHeaderName: X-Origin-Verify
            Values: [!Ref OriginVerifySecret]
      Actions:
        - Type: forward
          TargetGroupArn: !Ref AppTargetGroup

  # ------------------------------------------------------------------ WAF + CloudFront
  WafLogGroup:
    Type: AWS::Logs::LogGroup
    Properties:
      # WAF requires the aws-waf-logs- prefix.
      LogGroupName: !Sub "aws-waf-logs-insurance-assistant-${Environment}"
      RetentionInDays: !Ref LogRetentionDays

  WebAcl:
    Type: AWS::WAFv2::WebACL
    Properties:
      Name: !Sub "${AWS::StackName}-acl"
      Scope: CLOUDFRONT
      DefaultAction: {Allow: {}}
      VisibilityConfig:
        SampledRequestsEnabled: true
        CloudWatchMetricsEnabled: true
        MetricName: !Sub "${AWS::StackName}-acl"
      Rules:
        - Name: RateLimitPerIp
          Priority: 0
          Action: {Block: {}}
          Statement:
            RateBasedStatement:
              Limit: !Ref WafRateLimit
              AggregateKeyType: IP
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: RateLimitPerIp
        - Name: AmazonIpReputationList
          Priority: 1
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesAmazonIpReputationList}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: AmazonIpReputationList
        - Name: CommonRuleSet
          Priority: 2
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesCommonRuleSet}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: CommonRuleSet
        - Name: KnownBadInputsRuleSet
          Priority: 3
          OverrideAction: {None: {}}
          Statement:
            ManagedRuleGroupStatement: {VendorName: AWS, Name: AWSManagedRulesKnownBadInputsRuleSet}
          VisibilityConfig:
            SampledRequestsEnabled: true
            CloudWatchMetricsEnabled: true
            MetricName: KnownBadInputsRuleSet
      Tags:
        - {Key: Project, Value: insurance-policy-ai-assistant}
        - {Key: Owner, Value: Vinay Shinde}
        - {Key: Environment, Value: !Ref Environment}

  WafLogging:
    Type: AWS::WAFv2::LoggingConfiguration
    Properties:
      ResourceArn: !GetAtt WebAcl.Arn
      LogDestinationConfigs:
        - !Sub "arn:${AWS::Partition}:logs:${AWS::Region}:${AWS::AccountId}:log-group:${WafLogGroup}"
      LoggingFilter:
        DefaultBehavior: DROP
        Filters:
          - Behavior: KEEP
            Requirement: MEETS_ANY
            Conditions:
              - ActionCondition: {Action: BLOCK}
              - ActionCondition: {Action: COUNT}

  Distribution:
    Type: AWS::CloudFront::Distribution
    Properties:
      DistributionConfig:
        Comment: !Sub "Insurance Policy AI Assistant (${Environment})"
        Enabled: true
        HttpVersion: http2and3
        PriceClass: PriceClass_100
        WebACLId: !GetAtt WebAcl.Arn
        Origins:
          - Id: alb
            DomainName: !GetAtt LoadBalancer.DNSName
            CustomOriginConfig:
              OriginProtocolPolicy: http-only
              HTTPPort: 80
              OriginReadTimeout: 60
              OriginKeepaliveTimeout: 60
            OriginCustomHeaders:
              - HeaderName: X-Origin-Verify
                HeaderValue: !Ref OriginVerifySecret
        DefaultCacheBehavior:
          TargetOriginId: alb
          ViewerProtocolPolicy: redirect-to-https
          AllowedMethods: [GET, HEAD, OPTIONS, PUT, PATCH, POST, DELETE]
          CachedMethods: [GET, HEAD]
          Compress: true
          CachePolicyId: 4135ea2d-6df8-44a3-9df3-4b5a84be39ad          # Managed-CachingDisabled
          OriginRequestPolicyId: 216adef6-5c7f-47e4-b989-5492eafa07d3  # Managed-AllViewer
          ResponseHeadersPolicyId: 67f7725c-6f97-4210-82d7-5512b31e9d03 # Managed-SecurityHeadersPolicy
        ViewerCertificate:
          CloudFrontDefaultCertificate: true
      Tags:
        - {Key: Project, Value: insurance-policy-ai-assistant}
        - {Key: Owner, Value: Vinay Shinde}
        - {Key: Environment, Value: !Ref Environment}

  # ------------------------------------------------------------------ Alarms and dashboard
  AlarmTopic:
    Type: AWS::SNS::Topic
    Properties:
      DisplayName: Insurance Assistant alarms
      Subscription:
        - {Protocol: email, Endpoint: !Ref AlarmEmail}

  NoHealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: No healthy Streamlit instances behind the ALB.
      Namespace: AWS/ApplicationELB
      MetricName: HealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt AppTargetGroup.TargetGroupFullName}
      Statistic: Minimum
      Period: 60
      EvaluationPeriods: 3
      Threshold: 1
      ComparisonOperator: LessThanThreshold
      TreatMissingData: breaching
      AlarmActions: [!Ref AlarmTopic]
      OKActions: [!Ref AlarmTopic]

  UnhealthyHostsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: At least one Streamlit instance is failing health checks.
      Namespace: AWS/ApplicationELB
      MetricName: UnHealthyHostCount
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
        - {Name: TargetGroup, Value: !GetAtt AppTargetGroup.TargetGroupFullName}
      Statistic: Maximum
      Period: 60
      EvaluationPeriods: 5
      Threshold: 1
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Target5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Streamlit instances returned 5xx responses.
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_Target_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Elb5xxAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: The ALB itself returned 5xx responses (often no healthy targets).
      Namespace: AWS/ApplicationELB
      MetricName: HTTPCode_ELB_5XX_Count
      Dimensions:
        - {Name: LoadBalancer, Value: !GetAtt LoadBalancer.LoadBalancerFullName}
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 10
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  AppErrorsAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Application logged errors (Bedrock, S3 or DynamoDB failures).
      Namespace: !Sub "InsuranceAssistant/${Environment}"
      MetricName: AppErrors
      Statistic: Sum
      Period: 300
      EvaluationPeriods: 1
      Threshold: 5
      ComparisonOperator: GreaterThanOrEqualToThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  HighCpuAlarm:
    Type: AWS::CloudWatch::Alarm
    Properties:
      AlarmDescription: Average CPU above 85% for 15 minutes even with scaling.
      Namespace: AWS/EC2
      MetricName: CPUUtilization
      Dimensions:
        - {Name: AutoScalingGroupName, Value: !Ref AppAutoScalingGroup}
      Statistic: Average
      Period: 300
      EvaluationPeriods: 3
      Threshold: 85
      ComparisonOperator: GreaterThanThreshold
      TreatMissingData: notBreaching
      AlarmActions: [!Ref AlarmTopic]

  Dashboard:
    Type: AWS::CloudWatch::Dashboard
    Properties:
      DashboardName: !Sub "insurance-assistant-${Environment}"
      DashboardBody: !Sub
        - |
          {
            "widgets": [
              {"type": "metric", "x": 0, "y": 0, "width": 12, "height": 6, "properties": {
                "title": "Chat turns and guardrail interventions", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [["InsuranceAssistant/${Environment}", "ChatTurns"], [".", "GuardrailInterventions"], [".", "AppErrors"]]}},
              {"type": "metric", "x": 12, "y": 0, "width": 12, "height": 6, "properties": {
                "title": "ALB requests and errors", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [["AWS/ApplicationELB", "RequestCount", "LoadBalancer", "${LbName}"],
                            [".", "HTTPCode_Target_5XX_Count", ".", "."],
                            [".", "HTTPCode_ELB_5XX_Count", ".", "."]]}},
              {"type": "metric", "x": 0, "y": 6, "width": 12, "height": 6, "properties": {
                "title": "Healthy hosts", "region": "${AWS::Region}", "stat": "Minimum", "period": 60,
                "metrics": [["AWS/ApplicationELB", "HealthyHostCount", "TargetGroup", "${TgName}", "LoadBalancer", "${LbName}"]]}},
              {"type": "metric", "x": 12, "y": 6, "width": 12, "height": 6, "properties": {
                "title": "Instance CPU and memory", "region": "${AWS::Region}", "stat": "Average", "period": 300,
                "metrics": [["AWS/EC2", "CPUUtilization", "AutoScalingGroupName", "${AsgName}"],
                            ["InsuranceAssistant/${Environment}", "mem_used_percent", "AutoScalingGroupName", "${AsgName}"]]}},
              {"type": "metric", "x": 0, "y": 12, "width": 24, "height": 6, "properties": {
                "title": "Bedrock model", "region": "${AWS::Region}", "stat": "Sum", "period": 300,
                "metrics": [["AWS/Bedrock", "Invocations", "ModelId", "${ModelId}"],
                            [".", "InvocationThrottles", ".", "."],
                            [".", "InvocationServerErrors", ".", "."]]}}
            ]
          }
        - LbName: !GetAtt LoadBalancer.LoadBalancerFullName
          TgName: !GetAtt AppTargetGroup.TargetGroupFullName
          AsgName: !Ref AppAutoScalingGroup

Outputs:
  AppUrl:
    Description: Open this URL to use the assistant.
    Value: !Sub "https://${Distribution.DomainName}"
  DistributionId:
    Value: !Ref Distribution
  LoadBalancerArn:
    Value: !Ref LoadBalancer
  AutoScalingGroupName:
    Value: !Ref AppAutoScalingGroup
  AppLogGroupName:
    Value: !Ref AppLogGroup
  DashboardUrl:
    Value: !Sub "https://${AWS::Region}.console.aws.amazon.com/cloudwatch/home?region=${AWS::Region}#dashboards:name=insurance-assistant-${Environment}"
